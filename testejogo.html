:root{--blood:#e62020;--magic-purp:#b967ff;--magic-blue:#00d4ff}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#060408}
#root{width:100%;height:100vh;overflow:hidden}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.95}}
@keyframes dmgFloat{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}15%{opacity:1;transform:translate(-50%,-90%) scale(1.8)}80%{opacity:1;transform:translate(-50%,-155%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-200%) scale(.5)}}
@keyframes choiceReveal{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes portalSpin{0%{transform:rotate(0deg) scale(0);opacity:0}50%{transform:rotate(180deg) scale(1.2);opacity:1}100%{transform:rotate(360deg) scale(1);opacity:0}}
@keyframes laserShoot{0%{width:0;opacity:1}100%{width:350px;opacity:0}}
@keyframes explosionBurst{0%{transform:scale(0.1);opacity:1}50%{transform:scale(1.5);opacity:1}100%{transform:scale(2);opacity:0}}
@keyframes shadowPortalSpin{0%{transform:rotate(0deg) scale(0);opacity:0}50%{transform:rotate(-180deg) scale(1.2);opacity:1}100%{transform:rotate(-360deg) scale(1);opacity:0}}
@keyframes shadowLaserShoot{0%{width:0;opacity:1}100%{width:450px;opacity:0}}
@keyframes pinPulse{0%{opacity:.7;transform:scale(1)}70%{opacity:0;transform:scale(2.2)}100%{opacity:0}}

.crt{pointer-events:none;position:absolute;inset:0;z-index:9998;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.08) 3px,rgba(0,0,0,.08) 4px);mix-blend-mode:multiply}
.scanline{pointer-events:none;position:absolute;inset:0;z-index:9999;background:linear-gradient(180deg,rgba(255,255,255,.02) 0%,transparent 50%,rgba(0,0,0,.05) 100%);animation:float 8s ease-in-out infinite}
.pxl{image-rendering:pixelated;image-rendering:crisp-edges}
.btn{cursor:pointer;transition:all .2s;outline:none;border:none}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{filter:grayscale(1) brightness(.35);cursor:not-allowed}
.choice-btn{position:relative;overflow:hidden}
.choice-btn::before{content:'';position:absolute;inset:0;background:var(--kcol);opacity:0;transition:opacity .2s}
.choice-btn:hover::before{opacity:.08}
.choice-btn>div{position:relative;z-index:1}

/* BATTLE LAYOUT */
.battle-layout{display:grid;grid-template-columns:70% 30%;width:100%;height:100vh;overflow:hidden;background:#000;position:relative}
.battle-canvas-area{position:relative;overflow:hidden;border-right:4px solid #3b3552}
.cenario-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(.65)}
.hud-panel{position:absolute;z-index:20;background:rgba(18,16,26,.9);border:2px solid #3b3552;border-radius:4px;padding:10px;display:flex;gap:10px;box-shadow:3px 3px 0 #000}
.player-hud{top:20px;left:20px;width:340px}
.enemy-hud{top:20px;right:20px;width:300px;justify-content:flex-end}
.char-portrait{width:48px;height:48px;border:2px solid #3b3552;background:#000;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.portrait-img{width:100%;height:100%;object-fit:cover;object-position:top center}
.hp-mp-bars{flex:1;display:flex;flex-direction:column;gap:6px}
.action-ground{position:absolute;bottom:0;width:100%;height:65%;display:flex;justify-content:space-between;align-items:flex-end;padding:0 8% 25px 8%;z-index:10}
.char-sprite-box{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
.sprite-img{height:260px;width:auto;max-width:300px;object-fit:contain;filter:drop-shadow(0px 10px 5px rgba(0,0,0,.8));z-index:5;transition:transform .2s}
.enemy-img{transform:scaleX(-1);filter:drop-shadow(0px 0px 15px rgba(138,43,226,.6))}
.char-name-label{position:absolute;bottom:-20px;font-size:7px;font-family:'Press Start 2P',monospace;text-shadow:2px 2px 0 #000;white-space:nowrap;z-index:10;background:rgba(0,0,0,.7);padding:4px 8px;color:#fff;border:1px solid #555}
.right-ui-panel{display:flex;flex-direction:column;background:#0b050d;height:100%;position:relative;z-index:10}
.magic-spell-portal{position:absolute;width:120px;height:120px;border-radius:50%;box-shadow:0 0 40px var(--magic-purp),inset 0 0 30px #4a00e0;border:5px dashed var(--magic-purp);z-index:0;top:10%;animation:portalSpin 1s ease-out forwards;mix-blend-mode:screen}
.rainbow-laser{position:absolute;height:10px;left:90px;top:40%;background:linear-gradient(90deg,#ff007f,#7f00ff,var(--magic-blue),#fff);box-shadow:0 0 20px #fff,0 0 40px #7f00ff;z-index:10;transform-origin:left center;animation:laserShoot .6s ease-out forwards;animation-delay:.3s}
.shadow-spell-portal{position:absolute;width:120px;height:120px;border-radius:50%;box-shadow:0 0 50px #3a0a5a,inset 0 0 30px #000;border:5px dashed #4a00e0;z-index:0;top:10%;animation:shadowPortalSpin 1s ease-out forwards}
.shadow-laser{position:absolute;height:12px;right:90px;top:40%;background:linear-gradient(-90deg,#ff2200,#4a00e0,#000);box-shadow:0 0 20px #ff2200,0 0 40px #4a00e0;z-index:10;transform-origin:right center;animation:shadowLaserShoot .6s ease-out forwards;animation-delay:.3s}
.blood-explosion{position:absolute;width:120px;height:120px;background:radial-gradient(circle,#fff 5%,var(--blood) 30%,#ff6600 60%,transparent 80%);top:10%;left:10%;z-index:15;mix-blend-mode:screen;animation:explosionBurst .6s ease-out forwards;animation-delay:.1s}

/* MAP PINS */
.map-pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;transition:all .2s;z-index:20}

/* ══════════════════════════════════════
   SPRITE COMPONENT
══════════════════════════════════════ */
function Spr({data,scale=SC,flip=false,shadow=true,glowColor=null,style={}}){
  const pixels=useMemo(()=>typeof data==="function"?data():data,[data]);
  let maxX=0,maxY=0;
  pixels.forEach(([x,y])=>{if(x>maxX)maxX=x;if(y>maxY)maxY=y;});
  const W=(maxX+3)*scale,H=(maxY+3)*scale;
  const ref=useRef(null);
  useEffect(()=>{
    const c=ref.current;if(!c)return;
    c.width=W;c.height=H;
    const ctx=c.getContext("2d");
    ctx.clearRect(0,0,W,H);
    ctx.imageSmoothingEnabled=false;
    if(shadow){
      const sg=ctx.createRadialGradient(W/2,H-scale*.3,0,W/2,H-scale*.3,W/2.2);
      sg.addColorStop(0,"rgba(0,0,0,.55)");sg.addColorStop(.6,"rgba(0,0,0,.2)");sg.addColorStop(1,"transparent");
      ctx.fillStyle=sg;ctx.beginPath();ctx.ellipse(W/2,H-scale*.4,W/2.2,scale*.7,0,0,Math.PI*2);ctx.fill();
    }
    if(glowColor){ctx.shadowColor=glowColor;ctx.shadowBlur=scale*2;}
    pixels.forEach(([x,y,col])=>{
      if(!col)return;
      const px=(flip?(maxX-x):x)*scale,py=y*scale;
      ctx.fillStyle=col;ctx.fillRect(px,py,scale,scale);
    });
    ctx.shadowBlur=0;
  },[pixels,scale,flip,shadow,glowColor,W,H]);
  return <canvas ref={ref} width={W} height={H} className="pxl" style={{imageRendering:"pixelated",...style}}/>;
}

async function callAI(prompt,fallback){
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:300,system:"Você é o Mestre épico de um RPG de fantasia sombria medieval. Tom épico e sombrio. MÁXIMO 2 frases curtas. Português brasileiro. Comece DIRETO sem palavras introdutórias.",messages:[{role:"user",content:prompt}]})});
    if(!r.ok)throw new Error();
    const d=await r.json();
    const tx=d.content?.find(b=>b.type==="text")?.text?.trim();
    if(!tx||tx.length<4)throw new Error();

  }catch{return fallback||"O peso das sombras recai sobre o reino."}

   PARTICLE SYSTEM
══════════════════════════════════════ */
const ECONF={
  fire:{colors:["#ff6600","#ff4400","#ffcc00","#ff8800"],gravity:-.4,spread:3,count:30,size:[3,8],life:[280,500],glow:true},
  ice:{colors:["#a8d8f0","#00e5ff","#c8f0ff","#4ac8ff"],gravity:.06,spread:2,count:24,size:[2,6],life:[240,420],glow:false},
  dark:{colors:["#6a0dad","#8b00ff","#cc00ff","#4a0080"],gravity:-.2,spread:3,count:34,size:[3,9],life:[300,540],glow:true},
  heal:{colors:["#44ff88","#00ff44","#88ffaa","#00cc44"],gravity:-.5,spread:2,count:22,size:[3,7],life:[260,400],glow:true},
  light:{colors:["#ffdd00","#fff8aa","#ffcc44","#fff"],gravity:-.5,spread:2,count:24,size:[3,7],life:[240,380],glow:true},
  physical:{colors:["#ffffff","#ffeecc","#dddddd"],gravity:.3,spread:3,count:18,size:[2,5],life:[160,300],glow:false},
};

function hexToRgba(hex,a){
  if(!hex||!hex.startsWith("#"))return`rgba(100,100,100,${a})`;
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgba(${r},${g},${b},${a})`;
}

function createProjectile(x0,y0,x1,y1,el){
  const cfg=ECONF[el]||ECONF.physical;
  const angle=Math.atan2(y1-y0,x1-x0);
  const born=performance.now();
  const particles=[];
  for(let i=0;i<cfg.count;i++){
    const t=i/cfg.count;
    particles.push({x0:x0+(-25+Math.random()*50)*cfg.spread*.3,y0:y0+(-15+Math.random()*30)*cfg.spread*.3,x1:x1+(-12+Math.random()*24),y1:y1+(-12+Math.random()*24),born:born+t*380,life:cfg.life[0]+Math.random()*(cfg.life[1]-cfg.life[0]),size:cfg.size[0]+Math.random()*(cfg.size[1]-cfg.size[0]),color:cfg.colors[Math.floor(Math.random()*cfg.colors.length)],gravity:cfg.gravity*(-.5+Math.random()*2),glow:cfg.glow&&Math.random()>.4,alpha:.7+Math.random()*.3,phase:Math.random()*Math.PI*2,angle});
  }
  return{id:Math.random(),el,x1,y1,particles,born,dur:860};
}

function PartCanvas({projectiles}){
  const ref=useRef(null);
  const sRef=useRef({projectiles:[],raf:null});
  useEffect(()=>{sRef.current.projectiles=projectiles;},[projectiles]);
  useEffect(()=>{
    const canvas=ref.current;if(!canvas)return;
    const ctx=canvas.getContext("2d");
    function resize(){canvas.width=canvas.offsetWidth||window.innerWidth;canvas.height=canvas.offsetHeight||window.innerHeight;}
    resize();window.addEventListener("resize",resize);
    function frame(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const now=performance.now();
      sRef.current.projectiles.forEach(p=>{
        p.particles.forEach(pt=>{
          const life=now-pt.born;
          if(life<0||life>pt.life)return;
          const prog=life/pt.life;
          const x=pt.x0+(pt.x1-pt.x0)*prog;
          const y=pt.y0+(pt.y1-pt.y0)*prog+pt.gravity*prog*(1-prog)*200;
          const alpha=pt.alpha*(1-prog);
          ctx.fillStyle=hexToRgba(pt.color,alpha);
          if(pt.glow){ctx.shadowColor=pt.color;ctx.shadowBlur=pt.size*2;}
          ctx.fillRect(x,y,pt.size,pt.size);
          ctx.shadowBlur=0;
        });
      });
      sRef.current.raf=requestAnimationFrame(frame);
    }
    frame();
    return()=>{window.removeEventListener("resize",resize);if(sRef.current.raf)cancelAnimationFrame(sRef.current.raf);};
  },[]);
  return<canvas ref={ref} style={{position:"absolute",inset:0,zIndex:300,pointerEvents:"none",width:"100%",height:"100%"}}/>;
}

      <div style={{position:"relative",zIndex:10,background:"linear-gradient(180deg,rgba(6,4,8,.98) 0%,rgba(6,4,8,.6) 100%)",padding:"12px 20px",borderBottom:`1px solid ${k.color}44`,display:"flex",alignItems:"center",gap:12}}>
        <button onClick={onBack} className="btn" style={{background:"rgba(6,4,8,.9)",border:`1px solid ${k.color}44`,color:k.color,padding:"6px 12px",fontFamily:"'Press Start 2P',monospace",fontSize:7,cursor:"pointer"}}>← VOLTAR</button>
        <div>
          <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:6,color:k.color,letterSpacing:2}}>{k.capital.toUpperCase()}</div>
          <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:17,color:"#e8dcc8",letterSpacing:2}}>{k.name}</div>
        </div>
        <div style={{marginLeft:"auto",fontFamily:"'Press Start 2P',monospace",fontSize:6,color:k.color}}>PÁG {page+1}/{k.lore_pages.length}</div>
      </div>
      {/* Conteúdo */}
      <div style={{flex:1,position:"relative",zIndex:10,padding:"18px 26px",display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center"}}>
        <div style={{maxWidth:820,width:"100%",background:"rgba(6,4,8,.9)",border:`2px solid ${k.color}33`,padding:"28px 32px",boxShadow:`0 0 40px ${k.color}22`}}>
          <div style={{textAlign:"center",marginBottom:16}}>
            <div style={{fontSize:28,marginBottom:8}}>{pg.icon}</div>
            <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:21,color:k.color,letterSpacing:3,textShadow:`0 0 18px ${k.color}44`}}>{pg.title}</div>
          </div>
          <div style={{fontFamily:"'IM Fell English',serif",fontSize:19,color:"#e8dcc8",lineHeight:1.85,minHeight:110}}>
            {textShown}{!textDone&&<span style={{animation:"blink .5s step-start infinite"}}>█</span>}
          </div>
          {/* Heróis do reino */}
          {textDone&&page===k.lore_pages.length-1&&(
            <div style={{marginTop:20,borderTop:`1px solid ${k.color}22`,paddingTop:14}}>
              <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:6,color:k.color,marginBottom:10}}>HERÓIS DESTE REINO</div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                {k.party.map(c=>{
                  const cls=CLS[c.cls];
                  return(<div key={c.id} style={{display:"flex",alignItems:"center",gap:8,background:"rgba(255,255,255,.03)",border:`1px solid ${k.color}22`,padding:"6px 10px",flex:"1 1 180px"}}>
                    <Spr data={cls.spr(c.color)} scale={2} shadow={false}/>
                    <div>
                      <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:5,color:k.color}}>{c.name}</div>
                      <div style={{fontFamily:"'IM Fell English',serif",fontSize:11,color:"#5a4a6a"}}>{c.player} · {cls.label}</div>
                    </div>
                  </div>);
                })}
              </div>
            </div>
          )}
          <div style={{textAlign:"right",marginTop:16}}>
            <button onClick={handleNext} className="btn" style={{background:"rgba(6,4,8,.9)",border:`1px solid ${k.color}44`,color:k.color,padding:"8px 16px",fontFamily:"'Press Start 2P',monospace",fontSize:7,cursor:"pointer"}}>
              {textDone?(page<k.lore_pages.length-1?"PRÓXIMA →":"JOGAR →"):"CONTINUAR →"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

            const isSel=sel?.id===char.id;

            const col=char.color;
            const hasPhoto=char.photo&&!imgErr[char.id];
            return(
              <div key={char.id}

                <div style={{position:"relative",border:`2px solid ${isSel?col:isHov2?col+"88":"#2a1a3a"}`,background:"#0a0408",overflow:"hidden",boxShadow:isSel?`0 0 0 1px ${col}44,0 8px 30px rgba(0,0,0,.9)`:isHov2?"0 4px 20px rgba(0,0,0,.8)":"0 2px 8px rgba(0,0,0,.6)"}}>
                  <div style={{height:200,overflow:"hidden",position:"relative",background:"#08040c"}}>

                    <div style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,.8)",border:`1px solid ${col}66`,padding:"3px 7px",fontFamily:"'Press Start 2P',monospace",fontSize:6,color:col,letterSpacing:1}}>{charCls.icon} {charCls.label}</div>
                    {isSel&&<div style={{position:"absolute",inset:0,border:`3px solid ${col}`,boxShadow:`inset 0 0 20px ${col}44`,pointerEvents:"none"}}/>}

        <div style={{width:320,borderLeft:`1px solid ${k.color}22`,background:"rgba(6,4,8,.97)",display:"flex",flexDirection:"column",flexShrink:0,overflow:"hidden"}}>
          {sel?(
            <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column"}}>

                {sel.photo&&!imgErr[sel.id]
                  ?<img src={sel.photo} alt={sel.name} onError={()=>setImgErr(e=>({...e,[sel.id]:true}))} style={{width:"100%",height:"100%",objectFit:"cover",objectPosition:"top center",filter:"brightness(1.05) contrast(1.08)"}}/>
                  :<div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",background:`linear-gradient(180deg,${sel.color}22,#08040c)`}}>
                    <Spr data={CLS[sel.cls].spr(sel.color)} scale={6} shadow={true}/>

                <div style={{position:"absolute",bottom:0,left:0,right:0,height:80,background:"linear-gradient(0deg,rgba(6,4,8,1) 0%,transparent 100%)",pointerEvents:"none"}}/>
                <div style={{position:"absolute",bottom:8,left:0,right:0,textAlign:"center"}}>
                  <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:15,color:sel.color,letterSpacing:2,textShadow:`0 0 14px ${sel.color}88,2px 2px 4px #000`}}>{sel.name}</div>

                    <div key={s.label} style={{background:"rgba(0,0,0,.4)",border:"1px solid #1a1028",padding:"8px 6px",textAlign:"center"}}>

function ExploreScreen({kid,onBattle,onBack,onLore}){
  const k=KD[kid];
  const[step,setStep]=useState(0);
  const[gmText,setGmText]=useState("");
  const[gmLoad,setGmLoad]=useState(true);
  const[chosen,setChosen]=useState(null);
  const[diceRoll,setDiceRoll]=useState(null);
  const[rollingDice,setRollingDice]=useState(false);
  const[timer,setTimer]=useState(15);
  const[timerActive,setTimerActive]=useState(false);
  const timerRef=useRef(null);

  useEffect(()=>{
    setStep(0);setChosen(null);setDiceRoll(null);setRollingDice(false);setTimer(15);setTimerActive(false);
    callAI(`Introdução épica para ${k.name}: ${k.lore_title}`,`O peso das sombras recai sobre ${k.name}. O destino dos inocentes está em suas mãos.`)
      .then(t=>{setGmText(t);setGmLoad(false);setStep(1);});
    return()=>clearInterval(timerRef.current);
  },[kid]);

  useEffect(()=>{
    if(step===1&&!gmLoad){
      setTimer(15);setTimerActive(true);
      timerRef.current=setInterval(()=>{
        setTimer(prev=>{
          if(prev<=1){
            clearInterval(timerRef.current);
            setTimerActive(false);
            handleChoice(k.choices.find(c=>!c.heroic)||k.choices[0]);
            return 0;
          }
          return prev-1;
        });
      },1000);
    }
    return()=>clearInterval(timerRef.current);
  },[step,gmLoad]);

  const handleChoice=useCallback(async(ch)=>{
    clearInterval(timerRef.current);
    setTimerActive(false);
    setChosen(ch.id);
    setRollingDice(true);
    setGmLoad(true);
    // Rolar dado animado
    let frames=0;
    const rollAnim=setInterval(()=>{setDiceRoll(1+Math.floor(Math.random()*20));frames++;if(frames>15){clearInterval(rollAnim);const final=1+Math.floor(Math.random()*20);setDiceRoll(final);setRollingDice(false);}},60);
    callAI(`Consequência da decisão "${ch.text}" em ${k.name}.`,"A decisão foi tomada. A batalha começou.")
      .then(t=>{setGmText(t);setGmLoad(false);setStep(2);});
  },[k]);

  return(
    <div style={{width:"100%",height:"100vh",background:`radial-gradient(ellipse at 50% 30%,${k.dark} 0%,#060408 100%)`,display:"flex",flexDirection:"column",position:"relative",overflow:"hidden"}}>
      <div className="crt"/>
      <div style={{position:"relative",zIndex:10,flex:1,display:"flex",flexDirection:"column",justifyContent:"space-between",padding:"18px",gap:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <button onClick={onBack} className="btn" style={{background:"rgba(6,4,8,.9)",border:`1px solid ${k.color}44`,color:k.color,padding:"6px 12px",fontFamily:"'Press Start 2P',monospace",fontSize:7,cursor:"pointer"}}>← VOLTAR</button>
          <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:18,color:k.color,letterSpacing:3}}>{k.name}</div>
          <button onClick={onLore} className="btn" style={{background:"rgba(6,4,8,.9)",border:`1px solid ${k.color}44`,color:k.color,padding:"6px 12px",fontFamily:"'Press Start 2P',monospace",fontSize:7,cursor:"pointer"}}>LORE ℹ</button>
        </div>
        <DlgBox text={gmText} loading={gmLoad} kColor={k.color} onNext={undefined}/>
        <div>
          {step===1&&!gmLoad&&(
            <div style={{background:"rgba(6,4,8,.92)",border:`2px solid ${k.color}33`,padding:"14px 18px",animation:"fadeUp .3s ease"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:15,color:k.color,letterSpacing:2}}>SUA DECISÃO</div>
                {timerActive&&<div style={{fontFamily:"'Press Start 2P',monospace",fontSize:8,color:"#ff6600",animation:"blink .8s infinite"}}>⏳ {timer}s</div>}
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {k.choices.map((ch,i)=>(
                  <button key={ch.id} onClick={()=>handleChoice(ch)} className="btn choice-btn"
                    style={{background:"rgba(6,4,8,.9)",border:`1px solid ${k.color}44`,color:"#e8dcc8",padding:"10px 14px",fontFamily:"'Cinzel',serif",fontSize:14,cursor:"pointer",textAlign:"left",display:"flex",flexDirection:"column",gap:4,animation:`choiceReveal .3s ease ${i*.1}s forwards`,opacity:0,"--kcol":k.color}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontFamily:"'Press Start 2P',monospace",fontSize:7,color:k.color}}>{i+1}</span>
                      <span>{ch.text}</span>
                      {ch.heroic&&<span style={{marginLeft:"auto",fontFamily:"'Press Start 2P',monospace",fontSize:5,color:"#c9a84c",background:"rgba(201,168,76,.15)",border:"1px solid #c9a84c44",padding:"2px 6px"}}>⭐ HEROICO</span>}
                    </div>
                    <div style={{fontFamily:"'IM Fell English',serif",fontSize:12,color:"#5a4a6a",fontStyle:"italic",paddingLeft:24}}>{ch.detail}</div>
                  </button>
                ))}
              </div>
            </div>
          )}
          {step===2&&(
            <div style={{display:"flex",gap:10,justifyContent:"center",alignItems:"center",padding:"0 0 6px",animation:"fadeUp .4s ease"}}>
              <div style={{background:"rgba(6,4,8,.97)",border:`2px solid ${k.color}33`,padding:"10px 14px",display:"flex",alignItems:"center",gap:10}}>
                <D20 val={diceRoll} rolling={rollingDice}/>
                {!rollingDice&&diceRoll&&<div style={{fontFamily:"'Press Start 2P',monospace",fontSize:8,color:diceRoll>=18?"#ff6600":diceRoll<=3?"#4488ff":"#c9a84c"}}>D20: {diceRoll}</div>}
              </div>
              <button onClick={()=>onBattle(chosen)} className="btn"
                style={{background:`linear-gradient(135deg,${k.color}22,rgba(6,4,8,.9))`,border:`2px solid ${k.color}`,color:k.color,padding:"10px 30px",fontFamily:"'Cinzel Decorative',serif",fontSize:15,letterSpacing:3,cursor:"pointer",boxShadow:`0 0 22px ${k.color}44,0 7px 0 #050204`,animation:"pulse 1.5s infinite"}}>
                ⚔ PARTIR PARA A BATALHA
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   BATTLE SCREEN — JSX CORRIGIDO
══════════════════════════════════════ */
function BattleScreen({kid,chosenChar,choiceId,onEnd,onBack}){
  const k=KD[kid];
  const isHeroic=choiceId===k.heroicKey;
  const hBonus=isHeroic?5:0;

  const[party,setParty]=useState(()=>[{...chosenChar,hp:chosenChar.maxHp,mp:chosenChar.maxMp,atk:chosenChar.atk+hBonus,def:chosenChar.def+hBonus,type:"player"}]);
  const[enemies,setEnemies]=useState(()=>{
    if(kid==="chrnus"){
      return[{uid:"shadow_"+chosenChar.id,name:"Sombra de "+chosenChar.name.split(" ")[0],hp:Math.floor(chosenChar.maxHp*1.2),maxHp:Math.floor(chosenChar.maxHp*1.2),atk:chosenChar.atk+3,def:Math.max(1,chosenChar.def-2),spd:chosenChar.spd+1,spr:SPR.shadow(chosenChar.color),scale:7,glowColor:chosenChar.color,photo:chosenChar.id==="makhalev"?"Sombradolorde1.png":null,type:"enemy"}];
    }
    return k.enemies.map(e=>({...e,hp:e.maxHp,type:"enemy"}));
  });

  const[phase,setPhase]=useState("intro");
  const[activeId,setActiveId]=useState(null);
  const[pendingAct,setPending]=useState(null);
  const[anims,setAnims]=useState({});
  const[floats,setFloats]=useState([]);
  const[projectiles,setProjectiles]=useState([]);
  const[log,setLog]=useState([]);
  const[dice,setDice]=useState({rolling:false,val:20});
  const[result,setResult]=useState(null);
  const[gmLine,setGmLine]=useState("O Mestre aguarda o início...");
  const[gmLoad,setGmLoad]=useState(false);
  const[imgErr,setImgErr]=useState({});

  const pRef=useRef(party);
  const eRef=useRef(enemies);
  const toRef=useRef([]);
  const tRef=useRef(-1);

  useEffect(()=>{pRef.current=party;},[party]);
  useEffect(()=>{eRef.current=enemies;},[enemies]);

  // BUG FIX: calculateDamage definido como função normal, não useCallback
  // para evitar problemas de ordem de declaração
  const calculateDamage=(attacker,defender,skill,roll)=>{
    let baseDmg=attacker.atk*(skill?.dmgMult||1.0);
    let finalDmg=Math.max(1,baseDmg-(defender.def||8)*.7);
    let hitType="damage";
    if(roll>=18){finalDmg=Math.floor(finalDmg*1.7);hitType="crit";}
    else if(roll<=3){finalDmg=0;hitType="miss";}
    return{dmg:Math.floor(finalDmg),type:hitType};
  };

  const addLog=useCallback((msg)=>setLog(prev=>[msg,...prev].slice(0,5)),[]);
  const addAnim=useCallback((id,anim)=>{
    setAnims(prev=>({...prev,[id]:anim}));
    setTimeout(()=>setAnims(prev=>{const n={...prev};delete n[id];return n;}),anim==="die"?1200:600);
  },[]);

  const addFloat=useCallback((val,type,x,y)=>{
    const id=Math.random();
    setFloats(prev=>[...prev,{id,val,type,x,y}]);
    setTimeout(()=>setFloats(prev=>prev.filter(f=>f.id!==id)),1500);
  },[]);

  const rollD20=useCallback(()=>new Promise(res=>{
    let frames=0;
    const loop=setInterval(()=>{
      const v=1+Math.floor(Math.random()*20);
      setDice({rolling:true,val:v});
      frames++;
      if(frames>18){clearInterval(loop);const final=1+Math.floor(Math.random()*20);setDice({rolling:false,val:final});res(final);}
    },55);
  }),[]);

  // BUG FIX: nextTurn e doEnemyAction declarados com useRef para evitar
  // dependência circular entre si
  const nextTurnRef=useRef(null);
  const doEnemyRef=useRef(null);

  const nextTurn=useCallback(()=>{
    const lp=pRef.current.filter(c=>c.hp>0);
    const le=eRef.current.filter(e=>e.hp>0);
    if(lp.length===0){setResult("lose");setPhase("done");callAI("Derrota épica","Os heróis caem. As sombras vencem.").then(t=>setGmLine(t));return;}
    if(le.length===0){setResult("win");setPhase("done");callAI("Vitória gloriosa","A luz prevalece. As sombras recuam.").then(t=>setGmLine(t));return;}
    tRef.current=(tRef.current+1)%toRef.current.length;
    const actor=toRef.current[tRef.current];
    setActiveId(actor.id||actor.uid);
    if(actor.type==="player"){setPhase("player");}
    else{setPhase("enemy");setTimeout(()=>doEnemyRef.current&&doEnemyRef.current(actor.uid),800);}
  },[]);

  nextTurnRef.current=nextTurn;

  const doEnemyAction=useCallback(async(enemyId)=>{
    const enemy=eRef.current.find(e=>e.uid===enemyId);
    if(!enemy||enemy.hp<=0){nextTurnRef.current();return;}
    const lp=pRef.current.filter(c=>c.hp>0);
    if(lp.length===0)return;
    const target=lp[0];
    setPhase("rolling");
    addAnim(enemy.uid,"attack");

    const srcEl=document.getElementById(`enemy-${enemy.uid}`);
    const dstEl=document.getElementById(`char-${target.id}`);
    if(srcEl&&dstEl){
      const a=srcEl.getBoundingClientRect(),b=dstEl.getBoundingClientRect();
      const proj=createProjectile(a.left+a.width*.3,a.top+a.height*.3,b.left+b.width*.6,b.top+b.height*.3,"dark");
      setProjectiles(p=>[...p,proj]);
      setTimeout(()=>setProjectiles(p=>p.filter(x=>x.id!==proj.id)),proj.dur);
    }

    const roll=await rollD20();
    await new Promise(r=>setTimeout(r,380));

    const{dmg,type}=calculateDamage(enemy,target,{dmgMult:1.1},roll);
    setParty(prev=>prev.map(c=>c.id===target.id?{...c,hp:Math.max(0,c.hp-dmg)}:c));

    const box=dstEl?.getBoundingClientRect();
    if(box)addFloat(dmg,type,box.left+box.width/2,box.top+box.height*.2);
    addAnim(target.id,"hit");
    addLog(dmg===0?`${enemy.name} falha em atingir ${target.name}.`:`${enemy.name} causa ${dmg}${type==="crit"?" (crítico)":""} em ${target.name}.`);

    await new Promise(r=>setTimeout(r,500));
    nextTurnRef.current();
  },[rollD20,addAnim,addFloat,addLog]);

  doEnemyRef.current=doEnemyAction;

  const doPlayerAction=useCallback(async(actionType,element,targetId,skillName)=>{
    if(phase!=="selecting")return;
    const actor=pRef.current.find(c=>c.id===activeId);
    if(!actor||actor.hp<=0)return;
    setPhase("rolling");

    const isHeal=actionType==="heal";
    const skill=CLS[actor.cls].skills.find(s=>s.el===element&&(skillName?s.name===skillName:true))||null;
    const mpCost=skill?.mp||0;

    if(mpCost>0&&actor.mp<mpCost){addLog("MP insuficiente!");setPhase("player");return;}
    if(mpCost>0)setParty(prev=>prev.map(c=>c.id===actor.id?{...c,mp:c.mp-mpCost}:c));

    const target=isHeal?pRef.current.find(c=>c.id===targetId):eRef.current.find(e=>e.uid===targetId);
    if(!target){setPhase("player");return;}

    const srcEl=document.getElementById(`char-${actor.id}`);
    const dstEl=document.getElementById(isHeal?`char-${target.id}`:`enemy-${target.uid}`);
    if(srcEl&&dstEl){
      const a=srcEl.getBoundingClientRect(),b=dstEl.getBoundingClientRect();
      const proj=createProjectile(a.left+a.width*.7,a.top+a.height*.3,b.left+b.width*.3,b.top+b.height*.3,isHeal?"heal":(skill?.el||"physical"));
      setProjectiles(p=>[...p,proj]);
      setTimeout(()=>setProjectiles(p=>p.filter(x=>x.id!==proj.id)),proj.dur);
    }

    const roll=await rollD20();
    await new Promise(r=>setTimeout(r,380));

    if(isHeal){
      const heal=Math.floor((actor.atk*1.2+20)*(roll/10));
      setParty(prev=>prev.map(c=>c.id===target.id?{...c,hp:Math.min(c.maxHp,c.hp+heal)}:c));
      const box=dstEl?.getBoundingClientRect();
      if(box)addFloat(heal,"heal",box.left+box.width/2,box.top+box.height*.2);
      addLog(`${actor.name} cura ${target.name} em ${heal} HP.`);
    }else{
      const{dmg,type}=calculateDamage(actor,target,skill,roll);
      setEnemies(prev=>prev.map(e=>e.uid===target.uid?{...e,hp:Math.max(0,e.hp-dmg)}:e));
      const box=dstEl?.getBoundingClientRect();
      if(box)addFloat(dmg,type,box.left+box.width/2,box.top+box.height*.2);
      addAnim(target.uid,eRef.current.find(e=>e.uid===target.uid)?.hp-dmg<=0?"die":"hit");
      addLog(dmg===0?`${actor.name} erra o golpe!`:`${actor.name} causa ${dmg}${type==="crit"?" (crítico)":""} em ${target.name}.`);
    }

    setPending(null);
    await new Promise(r=>setTimeout(r,480));
    nextTurnRef.current();
  },[phase,activeId,rollD20,addAnim,addFloat,addLog]);

  const startBattle=useCallback(()=>{
    callAI(`Batalha começa em ${k.name} contra ${k.enemies.map(e=>e.name).join(", ")}.`,"Você pisa no campo de batalha. Seu adversário se revela.")
      .then(t=>{setGmLine(t);setGmLoad(false);});
    const order=[...pRef.current,...eRef.current].sort((a,b)=>b.spd-a.spd);
    toRef.current=order;tRef.current=-1;
    setTimeout(()=>nextTurnRef.current(),600);
  },[k]);

  const activeChar=party.find(c=>c.id===activeId&&c.hp>0);
  const displayEnemy=enemies.find(e=>e.hp>0)||enemies[0];

  return(
    <div className="battle-layout">
      <div className="crt"/>
      <PartCanvas projectiles={projectiles}/>
      {/* Dano flutuante — fixed position, fora do layout */}
      {floats.map(f=><FloatDmg key={f.id} val={f.val} type={f.type} x={f.x} y={f.y}/>)}

      {/* ÁREA DA TELA DE BATALHA (esquerda 70%) */}
      <div className="battle-canvas-area">
        <img src="cenario1.png" alt="Cenário" className="cenario-img" onError={e=>{e.target.style.display="none"}}/>

        {/* HUD Herói */}
        {party[0]&&(
          <div className="hud-panel player-hud">
            <div className="char-portrait">
              {party[0].photo&&!imgErr[party[0].id]
                ?<img src={party[0].photo} alt="Herói" className="portrait-img" onError={()=>setImgErr(p=>({...p,[party[0].id]:true}))}/>
                :<div style={{width:"100%",height:"100%",background:party[0].color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>{CLS[party[0].cls].icon}</div>}
            </div>
            <div className="hp-mp-bars">
              <div style={{fontSize:8,color:"#f3e0aa",fontFamily:"'Press Start 2P',monospace"}}>{party[0].name}</div>
              <Bar cur={party[0].hp} max={party[0].maxHp} color="#b02020" h={8} nums={true}/>
              <Bar cur={party[0].mp} max={party[0].maxMp} color="#2050b8" h={6}/>
            </div>
          </div>
        )}

        {/* HUD Inimigo */}
        {displayEnemy&&(
          <div className="hud-panel enemy-hud">
            <div className="hp-mp-bars" style={{textAlign:"right"}}>
              <div style={{fontSize:7,color:"#ff5555",fontFamily:"'Press Start 2P',monospace"}}>{displayEnemy.name}</div>
              <Bar cur={displayEnemy.hp} max={displayEnemy.maxHp} color="#b02020" h={8} nums={true}/>
            </div>
            <div className="char-portrait">
              {displayEnemy.photo&&!imgErr[displayEnemy.uid]
                ?<img src={displayEnemy.photo} alt="Inimigo" className="portrait-img" style={{transform:"scaleX(-1)"}} onError={()=>setImgErr(p=>({...p,[displayEnemy.uid]:true}))}/>
                :<div style={{width:"100%",height:"100%",background:displayEnemy.glowColor||"#333",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>👁</div>}
            </div>
          </div>
        )}

        {/* Turno + D20 */}
        <div style={{position:"absolute",top:15,left:"50%",transform:"translateX(-50%)",zIndex:50,display:"flex",gap:12,alignItems:"center"}}>
          <div style={{background:"rgba(5,3,8,.85)",border:`1px solid ${k.color}55`,padding:"7px 12px",fontSize:7,fontFamily:"'Press Start 2P',monospace",color:k.color}}>
            {phase==="intro"?"INÍCIO":phase==="player"?"SEU TURNO":phase==="enemy"?"INIMIGO":phase==="rolling"?"ROLANDO...":"FIM"}
          </div>
          {(dice.rolling||dice.val!==20)&&<D20 val={dice.val} rolling={dice.rolling}/>}
        </div>

        {/* CHÃO COM PERSONAGENS */}
        <div className="action-ground">
          {/* HERÓIS (esquerda) */}
          <div style={{display:"flex",gap:16,alignItems:"flex-end"}}>
            {party.map(c=>{
              const isActive=c.id===activeId&&(phase==="player"||phase==="selecting"||phase==="rolling");
              const dead=c.hp<=0;
              const canTarget=phase==="selecting"&&pendingAct?.type==="heal"&&!dead;
              return(
                <div key={c.id} id={`char-${c.id}`} className="char-sprite-box"
                  onClick={()=>{if(canTarget)doPlayerAction("heal","heal",c.id);}}
                  style={{opacity:dead?.3:1,transform:isActive?"translateY(-12px) scale(1.06)":"none",filter:isActive?`drop-shadow(0 0 12px ${k.color})`:canTarget?"drop-shadow(0 0 10px #44ff88)":"none",cursor:canTarget?"crosshair":"default",transition:"all .2s"}}>
                  {isActive&&phase==="rolling"&&pendingAct?.type==="skill"&&(
                    <><div className="magic-spell-portal"/><div className="rainbow-laser"/></>
                  )}
                  {c.photo&&!imgErr[c.id]
                    ?<img src={c.photo} className="sprite-img" alt={c.name} onError={()=>setImgErr(p=>({...p,[c.id]:true}))}/>
                    :<Spr data={CLS[c.cls].spr(c.color)} scale={5} shadow={!dead}/>}
                  <div className="char-name-label">{c.name.split(" ")[0]}</div>
                </div>
              );
            })}
          </div>

          {/* INIMIGOS (direita) */}
          <div style={{display:"flex",gap:16,alignItems:"flex-end"}}>
            {enemies.map(e=>{
              const isActive=e.uid===activeId&&(phase==="enemy"||phase==="rolling");
              const dead=e.hp<=0;
              const canTarget=phase==="selecting"&&pendingAct?.type!=="heal"&&!dead;
              const isAttacking=anims[e.uid]==="attack";
              const isHit=anims[e.uid]==="hit";
              return(
                <div key={e.uid} id={`enemy-${e.uid}`} className="char-sprite-box"
                  onClick={()=>{if(canTarget)doPlayerAction(pendingAct.type,pendingAct.el,e.uid,pendingAct.name);}}
                  style={{opacity:dead?.2:1,transform:isAttacking?"translateX(-45px) scale(1.1)":isActive?"translateY(-10px)":"none",transition:"transform .15s ease",filter:isActive?"drop-shadow(0 0 18px rgba(255,0,0,.8))":canTarget?"drop-shadow(0 0 12px #ff4444)":"none",cursor:canTarget?"crosshair":"default"}}>
                  {isActive&&<><div className="shadow-spell-portal"/><div className="shadow-laser"/></>}
                  {isHit&&<div className="blood-explosion"/>}
                  {e.photo&&!imgErr[e.uid]
                    ?<img src={e.photo} className="sprite-img enemy-img" alt={e.name} onError={()=>setImgErr(p=>({...p,[e.uid]:true}))}/>
                    :<Spr data={typeof e.spr==="function"?e.spr():e.spr} scale={e.scale||SC} shadow={!dead} glowColor={e.glowColor}/>}
                  <div className="char-name-label" style={{color:"#ff4444"}}>{e.name.split(" ")[0]}</div>
                </div>
              );
            })}
          </div>
        </div>{/* FIM action-ground */}
      </div>{/* FIM battle-canvas-area */}

      {/* PAINEL DIREITO (30%) */}
      <div className="right-ui-panel">
        {/* Comandos */}
        <div style={{flex:1,padding:18,borderBottom:"2px solid #3b3552",display:"flex",flexDirection:"column",gap:12,overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontFamily:"'Cinzel',serif",color:"#e8dcc8",fontSize:16}}>COMANDOS</div>
            <button className="btn" onClick={onBack} style={{fontFamily:"'Press Start 2P',monospace",fontSize:5,padding:"5px 8px",background:"rgba(10,6,18,.9)",border:"1px solid #553333",color:"#aa7777"}}>FUGIR</button>
          </div>

          {phase==="intro"&&(
            <button className="btn" onClick={startBattle} style={{width:"100%",height:70,background:"#2a1610",border:`2px solid ${k.color}`,color:k.color,fontFamily:"'Cinzel',serif",fontSize:16,boxShadow:`0 0 15px ${k.color}44`,letterSpacing:2}}>
              ⚔ ROLAR INICIATIVA
            </button>
          )}

          <div style={{background:"rgba(6,4,8,.9)",border:`1px solid ${k.color}22`,padding:"10px 12px",fontSize:13,fontFamily:"'IM Fell English',serif",color:"#a09080",fontStyle:"italic",lineHeight:1.5,animation:gmLoad?"breathe 1s infinite":undefined}}>
            {gmLoad?"O Mestre narra...":`"${gmLine}"`}
          </div>

          {phase==="player"&&activeChar&&(
            <div style={{background:"rgba(5,3,8,.95)",border:"1px solid #444",padding:12}}>
              <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:7,color:k.color,marginBottom:12}}>AÇÕES — {activeChar.name.toUpperCase()}</div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                <button className="btn" onClick={()=>{setPending({type:"attack",el:"physical"});setPhase("selecting");}}
                  style={{background:"#261010",border:"1px solid #b04040",color:"#ffb0a0",fontFamily:"'Press Start 2P',monospace",fontSize:7,padding:10,textAlign:"left",cursor:"pointer"}}>
                  ⚔ ATAQUE BÁSICO
                </button>
                {CLS[activeChar.cls].skills.map((s,idx)=>{
                  const dis=activeChar.mp<s.mp;
                  const col=elCols[s.el]||"#fff";
                  return(
                    <button key={idx} className="btn" disabled={dis}
                      onClick={()=>{setPending({type:"skill",el:s.el,name:s.name});setPhase("selecting");}}
                      style={{background:dis?"#120810":"#161018",border:`1px solid ${dis?"#333":col}`,color:dis?"#555":col,fontFamily:"'Press Start 2P',monospace",fontSize:7,padding:10,opacity:dis?.4:1,textAlign:"left",cursor:dis?"not-allowed":"pointer"}}>
                      {s.icon} {s.name.toUpperCase()} ({s.mp}MP)
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {phase==="selecting"&&<div style={{fontFamily:"'Press Start 2P',monospace",fontSize:8,color:"#ffcc66",textAlign:"center",padding:16,animation:"blink 1s infinite"}}>{pendingAct?.type==="heal"?"♥ CLIQUE NUM ALIADO":"◈ CLIQUE NUM INIMIGO"}</div>}
          {phase==="rolling"&&<div style={{fontFamily:"'Press Start 2P',monospace",fontSize:8,color:k.color,textAlign:"center",padding:16}}>ROLANDO O DADO...</div>}
          {phase==="enemy"&&<div style={{fontFamily:"'Press Start 2P',monospace",fontSize:8,color:"#ff5555",textAlign:"center",padding:16}}>INIMIGO PREPARA GOLPE...</div>}
          {phase==="done"&&(
            <div style={{textAlign:"center",padding:16}}>
              <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:24,color:result==="win"?"#c9a84c":"#ff5555",marginBottom:14}}>{result==="win"?"✦ VITÓRIA ✦":"✖ DERROTA ✖"}</div>
              <button className="btn" onClick={()=>onEnd(result==="win",isHeroic)} style={{fontFamily:"'Press Start 2P',monospace",fontSize:8,padding:"10px 20px",background:"rgba(10,6,18,.9)",border:`1px solid ${k.color}`,color:k.color,cursor:"pointer"}}>CONTINUAR →</button>
            </div>
          )}
        </div>

        {/* Log de batalha */}
        <div style={{flex:1,background:"#08060a",padding:16,overflowY:"auto"}}>
          <div style={{fontFamily:"'Cinzel',serif",color:"#555",fontSize:13,marginBottom:12,borderBottom:"1px solid #333",paddingBottom:5}}>REGISTRO DE BATALHA</div>
          <div style={{display:"flex",flexDirection:"column",gap:8,fontFamily:"'IM Fell English',serif",fontSize:15,color:"#e8dcc8"}}>
            {log.map((l,i)=>(
              <div key={i} style={{opacity:1-i*.15,borderLeft:i===0?`2px solid ${k.color}`:"2px solid transparent",paddingLeft:8}}>{l}</div>
            ))}
          </div>
        </div>
      </div>{/* FIM right-ui-panel */}
    </div>/* FIM battle-layout */
  );
}

/* ══════════════════════════════════════
   ENDING SCREEN
══════════════════════════════════════ */
function EndingScreen({scores,heroicScores,onRestart}){
  const[ep,setEp]=useState("");
  const[loading,setLoading]=useState(true);
  const hCount=Object.values(heroicScores).filter(v=>v===true).length;
  const dCount=Object.values(scores).filter(s=>s<1).length;
  const allH=hCount>=5;
  const g=allH
    ?{title:"A LUZ PREVALECE",color:"#c9a84c",icon:"⭐",desc:"Cinco reinos escolheram a verdade sobre o orgulho. O Ego foi dissipado pela única arma que ele nunca soube usar: a admissão honesta dos próprios erros."}
    :dCount>=3
    ?{title:"O EGO ASCENDE",color:"#cc2200",icon:"💀",desc:"O Ego agora tem forma, voz e coroa. Ghanor não foi conquistado por exércitos — foi traído por dentro."}
    :{title:"A CICATRIZ PERMANECE",color:"#4a7adf",icon:"🌙",desc:"Alguns reinos escolheram bem. Outros carregam feridas. O Ego foi enfraquecido — não destruído."};
  useEffect(()=>{
    callAI(`Final de Ghanor: "${g.title}". ${hCount} vitórias heroicas. Epílogo de 3 frases épicas.`,g.desc).then(t=>{setEp(t);setLoading(false);});
  },[]);
  return(
    <div style={{width:"100%",minHeight:"100vh",background:"radial-gradient(ellipse at 50% 0%,#1a0808 0%,#060408 70%)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"50px 40px",position:"relative"}}>
      <div className="crt"/>
      <div style={{maxWidth:820,textAlign:"center",position:"relative",zIndex:10,animation:"fadeUp .8s ease"}}>
        <div style={{fontSize:48,marginBottom:14}}>{g.icon}</div>
        <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:7,color:"#5a4a6a",letterSpacing:4,marginBottom:10}}>O CREPÚSCULO DE GHANOR</div>
        <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:26,color:g.color,letterSpacing:5,marginBottom:22,textShadow:`0 0 28px ${g.color}66`}}>{g.title}</div>
        <div style={{width:200,height:1,background:`linear-gradient(90deg,transparent,${g.color},transparent)`,margin:"0 auto 18px"}}/>
        <div style={{fontFamily:"'IM Fell English',serif",fontSize:18,color:"#e8dcc8",lineHeight:1.85,marginBottom:28,fontStyle:"italic"}}>"{loading?"O Mestre tece o epílogo...":ep}"</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:10,marginBottom:28}}>
          {Object.entries(scores).map(([kid,sc])=>{
            const k=KD[kid];if(!k)return null;
            const heroic=heroicScores[kid]===true,won=sc>=1;
            const e=heroic?k.ending.heroic:won?k.ending.bittersweet:k.ending.dark;
            return(<div key={kid} style={{background:"rgba(6,4,8,.97)",border:`1px solid ${heroic?"#c9a84c44":won?"#3a5a2a44":"#cc220044"}`,padding:"12px 14px",textAlign:"left"}}>
              <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:5,color:k.color,marginBottom:4}}>{k.icon} {k.name.toUpperCase()}</div>
              <div style={{fontFamily:"'Press Start 2P',monospace",fontSize:5,color:heroic?"#c9a84c":won?"#5a8a3a":"#cc2200",marginBottom:6}}>{heroic?"⭐ HEROICO":won?"○ VITÓRIA":"✖ DERROTA"}</div>
              <div style={{fontFamily:"'IM Fell English',serif",fontSize:12,color:"#5a4a6a",lineHeight:1.6,fontStyle:"italic"}}>"{e.slice(0,90)}..."</div>
            </div>);
          })}
        </div>
        <button onClick={onRestart} className="btn" style={{background:"rgba(6,4,8,.97)",border:"2px solid #3a2818",color:"#c9a84c",padding:"14px 40px",fontFamily:"'Cinzel',serif",fontSize:14,letterSpacing:4,cursor:"pointer",boxShadow:"0 8px 0 #030204"}}>
          REINICIAR O CICLO
        </button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   APP ROOT
══════════════════════════════════════ */
function App(){
  const[screen,setScreen]=useState("title");
  const[kid,setKid]=useState(null);
  const[scores,setScores]=useState({});
  const[heroicScores,setHeroicScores]=useState({});
  const[chosenChar,setChosenChar]=useState(null);
  const[choiceId,setChoiceId]=useState(null);
  const SIDE=["chrnus","loorum","zandar","magnos","prysma"];

  const handleBattleEnd=(won,isHeroic)=>{
    const ns={...scores,[kid]:won?1:0};
    setScores(ns);
    if(won&&isHeroic)setHeroicScores(h=>({...h,[kid]:true}));
    const allSide=SIDE.every(k=>ns[k]!==undefined);
    if(allSide&&!ns["erebor"]){setKid("erebor");setScreen("lore");}
    else if(ns["erebor"]!==undefined){setScreen("ending");}
    else{setScreen("map");}
  };

  return(
    <EB>
      {screen==="title"&&<TitleScreen onStart={()=>setScreen("map")}/>}
      {screen==="map"&&<MapScreen scores={scores} heroicScores={heroicScores} onSelect={k=>{setKid(k);setScreen("lore");}} onEnding={()=>setScreen("ending")}/>}
      {screen==="lore"&&kid&&<LoreScreen kid={kid} onPlay={()=>setScreen("charselect")} onBack={()=>setScreen("map")}/>}
      {screen==="charselect"&&kid&&<CharSelectScreen kid={kid} onConfirm={c=>{setChosenChar(c);setScreen("explore");}} onBack={()=>setScreen("lore")}/>}
      {screen==="explore"&&kid&&<ExploreScreen kid={kid} onBattle={cId=>{setChoiceId(cId);setScreen("battle");}} onBack={()=>setScreen("charselect")} onLore={()=>setScreen("lore")}/>}
      {screen==="battle"&&kid&&chosenChar&&<BattleScreen kid={kid} chosenChar={chosenChar} choiceId={choiceId} onEnd={handleBattleEnd} onBack={()=>setScreen("explore")}/>}
      {screen==="ending"&&<EndingScreen scores={scores} heroicScores={heroicScores} onRestart={()=>{setScores({});setHeroicScores({});setChosenChar(null);setChoiceId(null);setKid(null);setScreen("title");}}/>}
    </EB>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
